[package]
name = "bebo"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.7.0"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12.0"
lucide-icons = "1.73.0"
polling = "3"
pollster = "1.0.1"
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "gles", "wgsl", "std", "parking_lot"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30.13"
winreg = "0.55"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# Text shaping is too slow without optimization, also in a debug build.
[profile.dev.package."*"]
opt-level = 2
